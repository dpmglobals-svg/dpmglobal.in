<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPM Global - Admin Order Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            padding: 40px 20px;
        }
        .admin-container {
            max-width: 950px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        h2 {
            color: #0b3d91;
            margin-bottom: 8px;
            font-size: 28px;
        }
        p.subtitle {
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .order-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .order-card-header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #cbd5e1;
            padding-bottom: 8px;
        }
        .order-card-header h4 {
            color: #0f172a;
            font-size: 18px;
        }
        .order-card-header span {
            font-size: 12px;
            color: #64748b;
        }
        .detail-item {
            font-size: 14.5px;
            color: #334155;
        }
        .detail-item strong {
            color: #0b3d91;
        }
        .order-notes {
            grid-column: 1 / -1;
            background: #ffffff;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-size: 14px;
            color: #475569;
        }
        .no-order {
            text-align: center;
            color: #94a3b8;
            padding: 40px;
            font-size: 16px;
        }
        .clear-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
            margin-top: 15px;
        }
        .clear-btn:hover { background: #dc2626; }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #0b3d91;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }

        @media(max-width: 600px) {
            .order-card { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="admin-container">
    <h2>📦 Admin Order Panel</h2>
    <p class="subtitle">Yahan sirf aapko woh sabhi orders dikhenge jo customers ne website ke 'Order Form' se place kiye hain.</p>
    
    <div id="orderList">
        <!-- Orders dynamic load hongi -->
    </div>

    <button class="clear-btn" onclick="clearOrders()">Clear All Orders</button>
    <br>
    <a href="index.html" class="back-link">&larr; Back to Main Website</a>
</div>

<script>
    function loadOrders() {
        const orderList = document.getElementById('orderList');
        let orders = JSON.parse(localStorage.getItem('dpmOrders')) || [];

        if (orders.length === 0) {
            orderList.innerHTML = `<div class="no-order">Abhi tak koi bhi order nahi aaya hai.</div>`;
            return;
        }

        orderList.innerHTML = '';
        orders.forEach((o, index) => {
            orderList.innerHTML += `
                <div class="order-card">
                    <div class="order-card-header">
                        <h4>Order #${index + 1} - Product: <strong>${o.product}</strong></h4>
                        <span>⏰ ${o.time}</span>
                    </div>
                    <div class="detail-item"><strong>Customer Name:</strong> ${o.name}</div>
                    <div class="detail-item"><strong>Phone Number:</strong> ${o.phone}</div>
                    <div class="detail-item"><strong>Quantity:</strong> ${o.qty} MT</div>
                    <div class="detail-item"><strong>Destination Country:</strong> ${o.country}</div>
                    <div class="order-notes"><strong>Notes:</strong> ${o.notes}</div>
                </div>
            `;
        });
    }

    function clearOrders() {
        if (confirm("Kya aap saari orders history delete karna chahte hain?")) {
            localStorage.removeItem('dpmOrders');
            loadOrders();
        }
    }

    window.onload = loadOrders;
</script>

</body>
</html>
