<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPM Global - Admin Query Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
            padding: 40px 20px;
        }
        .admin-container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        h2 {
            color: #0b3d91;
            margin-bottom: 8px;
            font-size: 28px;
        }
        p.subtitle {
            color: #64748b;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .query-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
        }
        .query-card h4 {
            color: #0f172a;
            font-size: 18px;
            margin-bottom: 5px;
        }
        .query-card .email {
            font-size: 13px;
            color: #0284c7;
            margin-bottom: 10px;
            display: block;
        }
        .query-card .msg {
            font-size: 15px;
            color: #334155;
            background: #ffffff;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }
        .no-query {
            text-align: center;
            color: #94a3b8;
            padding: 40px;
            font-size: 16px;
        }
        .clear-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
            margin-top: 15px;
        }
        .clear-btn:hover {
            background: #dc2626;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #0b3d91;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="admin-container">
    <h2>🔒 Admin Query Panel</h2>
    <p class="subtitle">Yahan aapko woh sabhi messages aur queries dikhengi jo users ne website ke 'Contact Us' form se bheji hain.</p>
    
    <div id="queryList">
        <!-- Queries dynamic load hongi -->
    </div>

    <button class="clear-btn" onclick="clearQueries()">Clear All Queries</button>
    <br>
    <a href="index.html" class="back-link">&larr; Back to Main Website</a>
</div>

<script>
    function loadQueries() {
        const queryList = document.getElementById('queryList');
        let queries = JSON.parse(localStorage.getItem('dpmQueries')) || [];

        if (queries.length === 0) {
            queryList.innerHTML = `<div class="no-query">Abhi tak koi bhi query ya message nahi aaya hai.</div>`;
            return;
        }

        queryList.innerHTML = '';
        queries.forEach((q, index) => {
            queryList.innerHTML += `
                <div class="query-card">
                    <h4>#${index + 1} - ${q.name}</h4>
                    <span class="email">📧 ${q.email} | ⏰ ${q.time}</span>
                    <div class="msg"><strong>Message:</strong><br>${q.message}</div>
                </div>
            `;
        });
    }

    function clearQueries() {
        if (confirm("Kya aap saari queries delete karna chahte hain?")) {
            localStorage.removeItem('dpmQueries');
            loadQueries();
        }
    }

    window.onload = loadQueries;
</script>

</body>
</html>
